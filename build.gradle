plugins {
    id 'java'
    id 'application'
}

group = 'com.dizzyz7'
version = '0.5.8'

ext {
    gdxVersion = '1.14.2'
    gdxControllersVersion = '2.2.4'
    creatorName = 'Dimash Janibekov (DizZyZ7)'
    buildCommit = (System.getenv('GITHUB_SHA') ?: 'local').take(12)
    windowsUpgradeUuid = '57263352-be79-44e3-904f-955dcb29830a'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"

    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:${gdxControllersVersion}"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:${gdxControllersVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.dizzyz7.horsebound.DesktopLauncher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('run', JavaExec) {
    workingDir = projectDir
    standardInput = System.in
}

tasks.register('fatJar', Jar) {
    archiveFileName = 'HORSEBOUND.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': 'HORSEBOUND',
            'Implementation-Version': project.version,
            'Implementation-Vendor': creatorName,
            'Build-Commit': buildCommit,
            'Built-By': creatorName
        )
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('preparePackageInput', Sync) {
    dependsOn 'fatJar'
    into layout.buildDirectory.dir('package-input')
    from(layout.buildDirectory.file('libs/HORSEBOUND.jar'))
    from('THIRD_PARTY_NOTICES.txt')
    from('licenses') {
        into 'licenses'
    }
}

tasks.register('windowsImage', Exec) {
    dependsOn 'preparePackageInput'
    doFirst {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            throw new GradleException('windowsImage must be built on Windows because jpackage creates platform-specific launchers.')
        }
        delete layout.buildDirectory.dir('jpackage')
        def jpackage = "${System.getProperty('java.home')}\\bin\\jpackage.exe"
        commandLine jpackage,
            '--type', 'app-image',
            '--input', layout.buildDirectory.dir('package-input').get().asFile.absolutePath,
            '--main-jar', 'HORSEBOUND.jar',
            '--main-class', application.mainClass.get(),
            '--name', 'HORSEBOUND',
            '--app-version', project.version.toString(),
            '--vendor', creatorName,
            '--copyright', 'Copyright (c) 2026 Dimash Janibekov (DizZyZ7). All rights reserved.',
            '--description', 'HORSEBOUND - cozy 3D horse sandbox created by Dimash Janibekov (DizZyZ7).',
            '--dest', layout.buildDirectory.dir('jpackage').get().asFile.absolutePath
    }
    doLast {
        def imageRoot = layout.buildDirectory.dir('jpackage/HORSEBOUND').get().asFile
        copy {
            from 'THIRD_PARTY_NOTICES.txt'
            into imageRoot
        }
        copy {
            from 'licenses'
            into new File(imageRoot, 'licenses')
        }
    }
}

tasks.register('windowsInstaller', Exec) {
    dependsOn 'preparePackageInput'
    doFirst {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            throw new GradleException('windowsInstaller must be built on Windows because jpackage creates platform-specific installers.')
        }
        delete layout.buildDirectory.dir('installer')
        def jpackage = "${System.getProperty('java.home')}\\bin\\jpackage.exe"
        commandLine jpackage,
            '--type', 'exe',
            '--input', layout.buildDirectory.dir('package-input').get().asFile.absolutePath,
            '--main-jar', 'HORSEBOUND.jar',
            '--main-class', application.mainClass.get(),
            '--name', 'HORSEBOUND',
            '--app-version', project.version.toString(),
            '--vendor', creatorName,
            '--copyright', 'Copyright (c) 2026 Dimash Janibekov (DizZyZ7). All rights reserved.',
            '--description', 'HORSEBOUND - cozy 3D horse sandbox created by Dimash Janibekov (DizZyZ7).',
            '--license-file', file('LICENSE').absolutePath,
            '--win-per-user-install',
            '--win-dir-chooser',
            '--win-menu',
            '--win-menu-group', 'HORSEBOUND',
            '--win-shortcut',
            '--win-upgrade-uuid', windowsUpgradeUuid,
            '--dest', layout.buildDirectory.dir('installer').get().asFile.absolutePath
    }
}
