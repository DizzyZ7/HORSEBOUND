name: HORSEBOUND Apply Ranch Replacement Backup Fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified backup replacement patch
        shell: bash
        run: |
          base64 -d .github/dev/backup-replace.patch.b64 | gzip -d > /tmp/backup-replace.patch
          git apply --check /tmp/backup-replace.patch
          git apply /tmp/backup-replace.patch
          rm -rf .github/dev
          git config user.name "DizZyZ7 Release Bot"
          git config user.email "99655528+DizzyZ7@users.noreply.github.com"
          git add -A
          git commit -m "fix: replace recovery backup with new ranch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
