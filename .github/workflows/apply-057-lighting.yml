name: HORSEBOUND Apply 0.5.7 Lighting Pass

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-lighting-pass:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Integrate dynamic ambient and fill lighting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/main/java/com/dizzyz7/horsebound/LivingRanchScreen.java')
          text = source.read_text(encoding='utf-8')

          old_fields = '''    private final Environment environment = new Environment();
    private final DirectionalLight sun = new DirectionalLight();'''
          new_fields = '''    private final Environment environment = new Environment();
    private final ColorAttribute ambientLight = ColorAttribute.createAmbientLight(0.34f, 0.38f, 0.36f, 1f);
    private final DirectionalLight sun = new DirectionalLight();
    private final DirectionalLight fill = new DirectionalLight();'''
          if text.count(old_fields) != 1:
              raise SystemExit('Expected one environment field block')
          text = text.replace(old_fields, new_fields)

          old_setup = '''        environment.set(ColorAttribute.createAmbientLight(0.58f, 0.62f, 0.57f, 1f));
        sun.set(1f, 0.96f, 0.82f, -0.45f, -0.85f, -0.25f);
        environment.add(sun);'''
          new_setup = '''        environment.set(ambientLight);
        sun.set(1f, 0.96f, 0.82f, -0.45f, -0.85f, -0.25f);
        fill.set(0.28f, 0.34f, 0.46f, 0.42f, -0.30f, 0.70f);
        environment.add(sun);
        environment.add(fill);'''
          if text.count(old_setup) != 1:
              raise SystemExit('Expected one environment setup block')
          text = text.replace(old_setup, new_setup)

          old_sun_color = '''        sun.color.set(
            0.95f * daylight + 0.05f,
            0.87f * daylight + 0.08f,
            0.72f * daylight + 0.12f,
            1f
        );'''
          new_sun_color = '''        sun.color.set(
            0.95f * daylight + 0.05f,
            0.87f * daylight + 0.08f,
            0.72f * daylight + 0.12f,
            1f
        );
        ambientLight.color.set(
            0.13f + daylight * 0.25f,
            0.16f + daylight * 0.28f,
            0.22f + daylight * 0.20f,
            1f
        );
        fill.direction.set(0.42f, -0.30f, 0.70f).nor();
        float fillStrength = 0.18f + daylight * 0.20f;
        fill.color.set(
            fillStrength * 0.78f,
            fillStrength * 0.88f,
            fillStrength,
            1f
        );'''
          if text.count(old_sun_color) != 1:
              raise SystemExit('Expected one sun color block')
          text = text.replace(old_sun_color, new_sun_color)

          source.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-057-lighting.yml').unlink()
          PY
          git config user.name "DizZyZ7 Release Bot"
          git config user.email "99655528+DizzyZ7@users.noreply.github.com"
          git add -A
          git commit -m "feat: add dynamic ambient and fill lighting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
