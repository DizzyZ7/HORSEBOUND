name: HORSEBOUND Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout HORSEBOUND
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test compile and package Windows app
        shell: pwsh
        run: gradle clean test windowsImage --no-daemon --stacktrace

      - name: Verify Steam-ready app image
        shell: pwsh
        run: |
          $root = Resolve-Path "build/jpackage/HORSEBOUND"
          $required = @(
            "HORSEBOUND.exe",
            "app/HORSEBOUND.jar",
            "runtime"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (!(Test-Path $path)) {
              throw "Required packaged path is missing: $relative"
            }
          }

          $forbiddenNames = @(
            "settings.properties",
            "save.hbs",
            "save.bak",
            "save.tmp",
            "steam_dev.cfg"
          )
          $forbidden = Get-ChildItem $root -Recurse -File |
            Where-Object { $forbiddenNames -contains $_.Name }
          if ($forbidden) {
            $forbidden | Format-Table FullName
            throw "Mutable user data or local Steam configuration leaked into the app image"
          }

          $hashTargets = @(
            (Join-Path $root "HORSEBOUND.exe"),
            (Join-Path $root "app/HORSEBOUND.jar")
          )
          $hashLines = foreach ($target in $hashTargets) {
            $hash = Get-FileHash $target -Algorithm SHA256
            "$($hash.Hash)  $([System.IO.Path]::GetFileName($target))"
          }
          $hashLines | Set-Content (Join-Path $root "SHA256SUMS.txt") -Encoding ascii

          Get-Item (Join-Path $root "HORSEBOUND.exe") | Format-List Name,Length,FullName
          Get-Item (Join-Path $root "app/HORSEBOUND.jar") | Format-List Name,Length,FullName
          Get-Content (Join-Path $root "SHA256SUMS.txt")

      - name: Upload self-contained Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HORSEBOUND-Windows-x64
          path: build/jpackage/HORSEBOUND/
          if-no-files-found: error
          retention-days: 30
