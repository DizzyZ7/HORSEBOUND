name: HORSEBOUND Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout HORSEBOUND
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test compile and package Windows app
        shell: pwsh
        run: gradle clean test windowsImage --no-daemon --stacktrace

      - name: Verify Steam-ready app image
        shell: pwsh
        run: |
          $root = Resolve-Path "build/jpackage/HORSEBOUND"
          $required = @(
            "HORSEBOUND.exe",
            "app/HORSEBOUND.jar",
            "runtime",
            "THIRD_PARTY_NOTICES.txt",
            "licenses/APACHE-2.0.txt",
            "licenses/BSD-3-CLAUSE.txt",
            "licenses/ZLIB.txt"
          )

          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (!(Test-Path $path)) {
              throw "Required packaged path is missing: $relative"
            }
          }

          $forbiddenNames = @(
            "settings.properties",
            "input.properties",
            "save.hbs",
            "save.bak",
            "save.tmp",
            "steam_dev.cfg"
          )
          $forbidden = Get-ChildItem $root -Recurse -File |
            Where-Object { ($forbiddenNames -contains $_.Name) -or $_.Extension -eq ".log" }
          if ($forbidden) {
            $forbidden | Format-Table FullName
            throw "Mutable user data, crash logs or local Steam configuration leaked into the app image"
          }

          $adapterSource = "src/main/java/com/dizzyz7/horsebound/LivingRanchTelemetryAdapter.java"
          if (Test-Path $adapterSource) {
            throw "Obsolete LivingRanchTelemetryAdapter returned to the production source tree"
          }
          $homesteadSource = Get-Content "src/main/java/com/dizzyz7/horsebound/HomesteadRanchScreen.java" -Raw
          if ($homesteadSource.Contains("LivingRanchTelemetryAdapter")) {
            throw "HomesteadRanchScreen no longer uses RanchWorldAccess directly"
          }

          $jarPath = Join-Path $root "app/HORSEBOUND.jar"
          $jarEntries = & jar tf $jarPath
          $requiredJarEntries = @(
            "com/badlogic/gdx/controllers/Controllers.class",
            "com/badlogic/gdx/controllers/desktop/JamepadControllerManager.class",
            "com/studiohartman/jamepad/ControllerManager.class",
            "jamepad64.dll",
            "com/dizzyz7/horsebound/PromptOverlay.class",
            "com/dizzyz7/horsebound/InputGlyphCatalog.class",
            "com/dizzyz7/horsebound/ControllerGlyphFamily.class",
            "com/dizzyz7/horsebound/InputProfile.class",
            "com/dizzyz7/horsebound/InputProfileRepository.class",
            "com/dizzyz7/horsebound/InputProfileContext.class",
            "com/dizzyz7/horsebound/SettingsHubScreen.class",
            "com/dizzyz7/horsebound/SettingsScreen.class",
            "com/dizzyz7/horsebound/PauseScreen.class",
            "com/dizzyz7/horsebound/PauseRequestBus.class",
            "com/dizzyz7/horsebound/InputSettingsScreen.class",
            "com/dizzyz7/horsebound/KeyBindingsScreen.class",
            "com/dizzyz7/horsebound/KeyLabel.class",
            "com/dizzyz7/horsebound/SprintLatch.class",
            "com/dizzyz7/horsebound/ControllerRumble.class",
            "com/dizzyz7/horsebound/InventoryStack.class",
            "com/dizzyz7/horsebound/InventoryOverlay.class",
            "com/dizzyz7/horsebound/InventoryTransferService.class",
            "com/dizzyz7/horsebound/NavigationRepeater.class",
            "com/dizzyz7/horsebound/Hotbar.class",
            "com/dizzyz7/horsebound/HomesteadStructureType.class",
            "com/dizzyz7/horsebound/PlacedStructure.class",
            "com/dizzyz7/horsebound/HomesteadState.class",
            "com/dizzyz7/horsebound/HomesteadCollisionSystem.class",
            "com/dizzyz7/horsebound/HorseNeeds.class",
            "com/dizzyz7/horsebound/HorseCareSystem.class",
            "com/dizzyz7/horsebound/RanchSessionScreen.class",
            "com/dizzyz7/horsebound/RanchWorldAccess.class",
            "com/dizzyz7/horsebound/RanchUndoManager.class",
            "com/dizzyz7/horsebound/RanchDismantleConfirmation.class",
            "com/dizzyz7/horsebound/RanchCameraCollisionSystem.class",
            "com/dizzyz7/horsebound/RanchCameraFadeSystem.class",
            "com/dizzyz7/horsebound/RanchNatureCameraObstacle.class",
            "com/dizzyz7/horsebound/RanchAmbience.class",
            "com/dizzyz7/horsebound/GameplayHudCopy.class",
            "com/dizzyz7/horsebound/SafeGroundPlacement.class",
            "com/dizzyz7/horsebound/RanchPlacementCollision.class",
            "com/dizzyz7/horsebound/SaveSlotOverwriteConfirmation.class",
            "com/dizzyz7/horsebound/RanchAudio.class",
            "com/dizzyz7/horsebound/RanchPresentationObserver.class",
            "com/dizzyz7/horsebound/GateAnimationState.class",
            "com/dizzyz7/horsebound/GameSessionCapture.class",
            "com/dizzyz7/horsebound/HomesteadInputContext.class",
            "com/dizzyz7/horsebound/HomesteadActionBus.class",
            "com/dizzyz7/horsebound/HomesteadRuntimeInput.class",
            "com/dizzyz7/horsebound/LivingRanchScreen.class",
            "com/dizzyz7/horsebound/HomesteadModels.class",
            "com/dizzyz7/horsebound/HomesteadRenderer.class",
            "com/dizzyz7/horsebound/HomesteadRanchScreen.class"
          )
          foreach ($entry in $requiredJarEntries) {
            if ($jarEntries -notcontains $entry) {
              throw "Required runtime entry is missing from HORSEBOUND.jar: $entry"
            }
          }
          if ($jarEntries -contains "com/dizzyz7/horsebound/LivingRanchTelemetryAdapter.class") {
            throw "Obsolete LivingRanchTelemetryAdapter leaked into HORSEBOUND.jar"
          }

          $versionMatch = Select-String -Path "build.gradle" -Pattern "^\s*version\s*=\s*'([^']+)'" | Select-Object -First 1
          if (!$versionMatch) {
            throw "Could not derive the project version from build.gradle"
          }
          $expectedVersion = $versionMatch.Matches[0].Groups[1].Value
          $expectedCommit = $env:GITHUB_SHA.Substring(0, 12)
          $versionOutput = & java -jar $jarPath --version
          $expectedBuildLine = "HORSEBOUND $expectedVersion ($expectedCommit)"
          if ($versionOutput -notcontains $expectedBuildLine) {
            $versionOutput | Write-Host
            throw "Packaged build identity mismatch. Expected: $expectedBuildLine"
          }

          $hashTargets = @(
            (Join-Path $root "HORSEBOUND.exe"),
            $jarPath,
            (Join-Path $root "THIRD_PARTY_NOTICES.txt")
          )
          $hashLines = foreach ($target in $hashTargets) {
            $hash = Get-FileHash $target -Algorithm SHA256
            "$($hash.Hash)  $([System.IO.Path]::GetFileName($target))"
          }
          $hashLines | Set-Content (Join-Path $root "SHA256SUMS.txt") -Encoding ascii

          $versionOutput | Write-Host
          Get-Item (Join-Path $root "HORSEBOUND.exe") | Format-List Name,Length,FullName
          Get-Item $jarPath | Format-List Name,Length,FullName
          Get-Content (Join-Path $root "SHA256SUMS.txt")

      - name: Upload self-contained Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HORSEBOUND-Windows-x64
          path: build/jpackage/HORSEBOUND/
          if-no-files-found: error
          retention-days: 30
