name: HORSEBOUND 0.5.8 Source Audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4

      - name: Upload localization audit source
        uses: actions/upload-artifact@v4
        with:
          name: HORSEBOUND-0.5.8-source-audit
          path: |
            src/main/java
            src/test/java
            build.gradle
            .github/workflows/windows-build.yml
          if-no-files-found: error
          retention-days: 3
