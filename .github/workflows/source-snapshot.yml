name: HORSEBOUND Source Snapshot

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout HORSEBOUND
        uses: actions/checkout@v4

      - name: Archive exact PR source
        shell: bash
        run: zip -qr HORSEBOUND-source.zip . -x '.git/*' 'build/*' '*.log'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: HORSEBOUND-source-snapshot
          path: HORSEBOUND-source.zip
          if-no-files-found: error
          retention-days: 1
